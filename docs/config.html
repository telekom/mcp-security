<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides Config</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/inter.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a14;
            color: #f0f0f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: #1a1a2e;
            border: 1px solid rgba(226, 0, 116, 0.2);
            border-radius: 20px;
            padding: 48px 52px;
            width: 100%;
            max-width: 560px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #E20074, #ff3399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #8888a2;
            margin-bottom: 36px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8888a2;
            margin-bottom: 8px;
            margin-top: 24px;
        }

        label:first-of-type { margin-top: 0; }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 18px;
            font-family: inherit;
            font-size: 1.1rem;
            color: #f0f0f5;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: rgba(226, 0, 116, 0.5);
        }

        input::placeholder { color: #444466; }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 36px;
        }

        button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-save {
            background: #E20074;
            color: white;
        }

        .btn-save:hover { background: #c8006a; }

        .btn-clear {
            background: rgba(255, 255, 255, 0.06);
            color: #8888a2;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-clear:hover { background: rgba(255, 68, 102, 0.1); color: #ff4466; border-color: rgba(255, 68, 102, 0.3); }

        .status {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            display: none;
        }

        .status.saved {
            display: block;
            background: rgba(0, 168, 160, 0.1);
            border: 1px solid rgba(0, 168, 160, 0.3);
            color: #00A8A0;
        }

        .status.cleared {
            display: block;
            background: rgba(255, 68, 102, 0.08);
            border: 1px solid rgba(255, 68, 102, 0.25);
            color: #ff4466;
        }

        .open-link {
            display: block;
            margin-top: 28px;
            text-align: center;
            color: #8888a2;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .open-link:hover { color: #E20074; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Slides Configuration</h1>
        <p class="subtitle">Set conference details for the title slide. Stored locally in your browser.</p>

        <label for="conf-name">Conference Name</label>
        <input type="text" id="conf-name" placeholder="e.g. JavaLand 2025">

        <label for="conf-location">Location</label>
        <input type="text" id="conf-location" placeholder="e.g. Brühl, Germany">

        <label for="conf-date">Date</label>
        <input type="text" id="conf-date" placeholder="e.g. 25. März 2025">

        <div class="actions">
            <button class="btn-save" onclick="save()">Save</button>
            <button class="btn-clear" onclick="clear()">Clear</button>
        </div>

        <div class="status" id="status"></div>

        <a href="index.html" class="open-link">→ Open slides</a>
    </div>

    <script>
        const KEYS = {
            name:     'mcp_conf_name',
            location: 'mcp_conf_location',
            date:     'mcp_conf_date',
        };

        // Load existing values on page open
        document.getElementById('conf-name').value     = localStorage.getItem(KEYS.name)     || '';
        document.getElementById('conf-location').value = localStorage.getItem(KEYS.location) || '';
        document.getElementById('conf-date').value     = localStorage.getItem(KEYS.date)     || '';

        function save() {
            const name = document.getElementById('conf-name').value.trim();
            const loc  = document.getElementById('conf-location').value.trim();
            const date = document.getElementById('conf-date').value.trim();

            if (name)     localStorage.setItem(KEYS.name, name);
            else          localStorage.removeItem(KEYS.name);
            if (loc)      localStorage.setItem(KEYS.location, loc);
            else          localStorage.removeItem(KEYS.location);
            if (date)     localStorage.setItem(KEYS.date, date);
            else          localStorage.removeItem(KEYS.date);

            showStatus('saved', '✓ Saved — reload the slides to see the changes.');
        }

        function clear() {
            Object.values(KEYS).forEach(k => localStorage.removeItem(k));
            document.getElementById('conf-name').value     = '';
            document.getElementById('conf-location').value = '';
            document.getElementById('conf-date').value     = '';
            showStatus('cleared', '✕ Cleared — title slide will show the default label.');
        }

        function showStatus(type, msg) {
            const el = document.getElementById('status');
            el.className = 'status ' + type;
            el.textContent = msg;
            setTimeout(() => { el.className = 'status'; }, 4000);
        }

        // Save on Enter key
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
        });
    </script>
</body>
</html>
